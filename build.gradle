plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.9.0"
}

group 'com.xhhao.com.releasehub'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.0')
    compileOnly 'run.halo.app:api'
    compileOnly 'io.projectreactor.netty:reactor-netty-http'
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.jsoup:jsoup:1.21.1'
    implementation 'org.yaml:snakeyaml'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.27'
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.register('processFrontendResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('frontend')
    into layout.buildDirectory.dir('resources/main/static/frontend')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}
tasks.named('classes') { dependsOn tasks.named('processFrontendResources') }

haloPlugin {
    openApi {
        groupingRules {
            releaseHub {
                displayName = 'Release Hub API'
                pathsToMatch = ['/apis/*release-hub.xhhao.com/**']
            }
        }
        groupedApiMappings = ['/v3/api-docs/releaseHub': 'releaseHub.json']
        generator { outputDir = file("${projectDir}/ui/src/api/generated") }
    }
}
